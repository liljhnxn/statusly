<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1833" />
      <stop offset="100%" stop-color="#0e0e14" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="32" height="32" rx="8" fill="url(#bg)" stroke="#8b5cf6" stroke-opacity="0.3" stroke-width="1.2" />

  <!-- Outer broadcast ring -->
  <path d="M4.5 16 A11.5 11.5 0 0 1 27.5 16" stroke="#8b5cf6" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.5" />
  
  <!-- Middle broadcast ring -->
  <path d="M8 16 A8 8 0 0 1 24 16" stroke="#a855f7" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.8" />

  <!-- Center status dot with green live glow -->
  <circle cx="16" cy="16" r="3.2" fill="#10b981" filter="url(#glow)" />
  <circle cx="16" cy="16" r="1.4" fill="#ecfdf5" />

  <!-- Lower subtle signal arch -->
  <path d="M10.5 20 A7 7 0 0 0 21.5 20" stroke="#34d399" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.6" />
</svg>

